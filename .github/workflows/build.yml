name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept licenses and install SDK platform and build tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $SDKM"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          (yes | "$SDKM" --licenses > /dev/null) || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate the whole app project
        run: |
          set -e
          mkdir -p _app && cd _app
          mkdir -p .
          cat > settings.gradle.kts <<'DNEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DataNet"
          include(":app")
          DNEOF
          mkdir -p .
          cat > build.gradle.kts <<'DNEOF'
          plugins {
              id("com.android.application") version "8.9.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("com.google.gms.google-services") version "4.4.2" apply false
          }
          DNEOF
          mkdir -p .
          cat > gradle.properties <<'DNEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          DNEOF
          mkdir -p app
          cat > app/build.gradle.kts <<'DNEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.gms.google-services")
          }

          android {
              namespace = "com.datanet.portal"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.datanet.portal"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 4
                  versionName = "1.3"
                  // عنوان البوابة اللي بيفتحها التطبيق. غيّره هون فقط.
                  buildConfigField("String", "PORTAL_URL", "\"https://portal.datnet-pro.com/me\"")
              }

              buildFeatures {
                  buildConfig = true
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
              implementation(platform("com.google.firebase:firebase-bom:33.5.1"))
              implementation("com.google.firebase:firebase-messaging-ktx")
          }
          DNEOF
          cat > app/google-services.json <<'DNEOF'
          {
            "project_info": {
              "project_number": "705172362265",
              "project_id": "dataradiuss",
              "storage_bucket": "dataradiuss.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:705172362265:android:98c3babea3be16bfc88688",
                  "android_client_info": {
                    "package_name": "com.datanet.portal"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyC1V3xmsZosGAHUZdiVRLtkZ-owezukWvg"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          DNEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'DNEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.DataNet"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DataNetMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          DNEOF
          mkdir -p app/src/main/java/com/datanet/portal
          cat > app/src/main/java/com/datanet/portal/MainActivity.kt <<'DNEOF'
          package com.datanet.portal

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import android.net.http.SslError
          import android.webkit.CookieManager
          import android.webkit.SslErrorHandler
          import android.webkit.WebResourceResponse
          import android.webkit.JsResult
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout

          class MainActivity : AppCompatActivity() {

              private lateinit var web: WebView
              private lateinit var refresh: SwipeRefreshLayout
              private val portalHost: String = Uri.parse(BuildConfig.PORTAL_URL).host ?: ""

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  web = findViewById(R.id.web)
                  refresh = findViewById(R.id.refresh)

                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                      allowFileAccess = false
                      allowContentAccess = false
                  }
                  CookieManager.getInstance().setAcceptCookie(true)

                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val uri = request.url
                          if (uri.host == portalHost) return false
                          // أي رابط خارج البوابة (واتساب، خرائط...) بيفتح بتطبيقه
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, uri))
                          } catch (_: Exception) {
                          }
                          return true
                      }

                      override fun onPageStarted(view: WebView, url: String?, favicon: Bitmap?) {
                          refresh.isRefreshing = true
                      }

                      override fun onPageFinished(view: WebView, url: String?) {
                          refresh.isRefreshing = false
                          CookieManager.getInstance().flush()
                          registerFcmTokenIfNeeded(view)
                      }

                      override fun onReceivedError(view: WebView, request: WebResourceRequest, error: WebResourceError) {
                          if (request.isForMainFrame) showOffline("تعذّر الوصول للبوابة (${error.description})")
                      }

                      override fun onReceivedHttpError(view: WebView, request: WebResourceRequest, errorResponse: WebResourceResponse) {
                          if (request.isForMainFrame && errorResponse.statusCode >= 400) showOffline("البوابة ردّت بخطأ ${errorResponse.statusCode}")
                      }

                      override fun onReceivedSslError(view: WebView, handler: SslErrorHandler, error: SslError) {
                          handler.cancel()
                          showOffline("مشكلة بشهادة الأمان (HTTPS) للبوابة")
                      }
                  }

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onJsConfirm(view: WebView, url: String?, message: String?, result: JsResult): Boolean {
                          AlertDialog.Builder(this@MainActivity)
                              .setMessage(message)
                              .setPositiveButton(android.R.string.ok) { _, _ -> result.confirm() }
                              .setNegativeButton(android.R.string.cancel) { _, _ -> result.cancel() }
                              .setOnCancelListener { result.cancel() }
                              .show()
                          return true
                      }

                      override fun onJsAlert(view: WebView, url: String?, message: String?, result: JsResult): Boolean {
                          AlertDialog.Builder(this@MainActivity)
                              .setMessage(message)
                              .setPositiveButton(android.R.string.ok) { _, _ -> result.confirm() }
                              .setOnCancelListener { result.confirm() }
                              .show()
                          return true
                      }
                  }

                  refresh.setOnChildScrollUpCallback { _, _ -> web.scrollY > 0 }
                  refresh.setOnRefreshListener { reload() }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (web.canGoBack()) web.goBack() else finish()
                      }
                  })

                  if (savedInstanceState != null) web.restoreState(savedInstanceState) else web.loadUrl(BuildConfig.PORTAL_URL)

                  askNotificationPermission()
              }

              private fun askNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      val granted = ContextCompat.checkSelfPermission(
                          this, Manifest.permission.POST_NOTIFICATIONS
                      ) == PackageManager.PERMISSION_GRANTED
                      if (!granted) {
                          ActivityCompat.requestPermissions(
                              this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1001
                          )
                      }
                  }
              }

              private fun registerFcmTokenIfNeeded(view: WebView) {
                  val prefs = getSharedPreferences("datanet_prefs", MODE_PRIVATE)
                  val token = prefs.getString("fcm_token", null) ?: return
                  if (prefs.getBoolean("fcm_token_sent", false)) return
                  val safe = org.json.JSONObject.quote(token)
                  view.evaluateJavascript(
                      "(function(){ if (window.registerFcmToken) { window.registerFcmToken($safe); return true; } return false; })();"
                  ) { result ->
                      if (result == "true") {
                          prefs.edit().putBoolean("fcm_token_sent", true).apply()
                      }
                  }
              }

              private fun reload() {
                  // إذا كانت صفحة "لا يوجد اتصال" ظاهرة، نعيد تحميل البوابة نفسها
                  val cur = web.url ?: ""
                  if (cur.isEmpty() || cur.startsWith("data:") || cur.startsWith("about:")) web.loadUrl(BuildConfig.PORTAL_URL) else web.reload()
              }

              private fun showOffline(reason: String = "") {
                  refresh.isRefreshing = false
                  val html = assets.open("offline.html").bufferedReader().use { it.readText() }
                      .replace("%URL%", BuildConfig.PORTAL_URL)
                      .replace("%REASON%", android.text.Html.escapeHtml(reason))
                  web.loadDataWithBaseURL(BuildConfig.PORTAL_URL, html, "text/html", "utf-8", null)
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  web.saveState(outState)
              }

              override fun onPause() {
                  super.onPause()
                  CookieManager.getInstance().flush()
              }
          }
          DNEOF
          cat > app/src/main/java/com/datanet/portal/DataNetMessagingService.kt <<'DNEOF'
          package com.datanet.portal

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import com.google.firebase.messaging.FirebaseMessagingService
          import com.google.firebase.messaging.RemoteMessage

          class DataNetMessagingService : FirebaseMessagingService() {

              companion object {
                  private const val CHANNEL_ID = "datanet_notifications"
              }

              override fun onNewToken(token: String) {
                  super.onNewToken(token)
                  getSharedPreferences("datanet_prefs", MODE_PRIVATE)
                      .edit()
                      .putString("fcm_token", token)
                      .putBoolean("fcm_token_sent", false)
                      .apply()
              }

              override fun onMessageReceived(message: RemoteMessage) {
                  super.onMessageReceived(message)

                  val title = message.notification?.title
                      ?: message.data["title"]
                      ?: getString(R.string.app_name)
                  val body = message.notification?.body
                      ?: message.data["body"]
                      ?: return

                  showNotification(title, body)
              }

              private fun showNotification(title: String, body: String) {
                  val nm = getSystemService(NotificationManager::class.java)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val existing = nm.getNotificationChannel(CHANNEL_ID)
                      if (existing == null) {
                          val channel = NotificationChannel(
                              CHANNEL_ID,
                              "إشعارات داتا نت",
                              NotificationManager.IMPORTANCE_HIGH
                          ).apply {
                              description = "تنبيهات الاشتراك والفواتير وانتهاء الباقة"
                          }
                          nm.createNotificationChannel(channel)
                      }
                  }

                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK
                  }
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setAutoCancel(true)
                      .setContentIntent(pendingIntent)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .build()

                  nm.notify(System.currentTimeMillis().toInt(), notification)
              }
          }
          DNEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'DNEOF'
