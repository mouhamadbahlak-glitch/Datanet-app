          DNEOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/offline.html <<'DNEOF'
          <!doctype html>
          <html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#122028;color:#e8eef0;font-family:sans-serif;text-align:center;padding:24px}
          h1{font-size:20px;margin:0 0 8px}p{opacity:.75;font-size:14px;margin:0 0 24px}
          a{display:inline-block;background:#337B8F;color:#fff;text-decoration:none;padding:12px 32px;border-radius:12px;font-size:16px}
          </style></head><body><div>
          <h1>ما في اتصال بالبوابة</h1>
          <p>تأكد إنك متصل بخط الإنترنت تبعك وجرّب مرة ثانية.</p>
          <p style="font-size:12px;direction:ltr">%REASON%</p>
          <a href="%URL%">إعادة المحاولة</a>
          </div></body></html>
          DNEOF
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          echo '' | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
