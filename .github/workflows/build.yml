name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate the whole app project
        run: |
          set -e
          mkdir -p _app && cd _app
          mkdir -p .
          cat > settings.gradle.kts <<'DNEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DataNet"
          include(":app")
          DNEOF
          mkdir -p .
          cat > build.gradle.kts <<'DNEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          DNEOF
          mkdir -p .
          cat > gradle.properties <<'DNEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          DNEOF
          mkdir -p app
          cat > app/build.gradle.kts <<'DNEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.datanet.portal"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.datanet.portal"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
                  // عنوان البوابة اللي بيفتحها التطبيق. غيّره هون فقط.
                  buildConfigField("String", "PORTAL_URL", "\"https://portal.datnet-pro.com/me\"")
              }

              buildFeatures {
                  buildConfig = true
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
          }
          DNEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'DNEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.DataNet"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          DNEOF
          mkdir -p app/src/main/java/com/datanet/portal
          cat > app/src/main/java/com/datanet/portal/MainActivity.kt <<'DNEOF'
          package com.datanet.portal

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.CookieManager
          import android.webkit.JsResult
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout

          class MainActivity : AppCompatActivity() {

              private lateinit var web: WebView
              private lateinit var refresh: SwipeRefreshLayout
              private val portalHost: String = Uri.parse(BuildConfig.PORTAL_URL).host ?: ""

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  web = findViewById(R.id.web)
                  refresh = findViewById(R.id.refresh)

                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                      allowFileAccess = false
                      allowContentAccess = false
                  }
                  CookieManager.getInstance().setAcceptCookie(true)

                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val uri = request.url
                          if (uri.host == portalHost) return false
                          // أي رابط خارج البوابة (واتساب، خرائط...) بيفتح بتطبيقه
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, uri))
                          } catch (_: Exception) {
                          }
                          return true
                      }

                      override fun onPageStarted(view: WebView, url: String?, favicon: Bitmap?) {
                          refresh.isRefreshing = true
                      }

                      override fun onPageFinished(view: WebView, url: String?) {
                          refresh.isRefreshing = false
                          CookieManager.getInstance().flush()
                      }

                      override fun onReceivedError(view: WebView, request: WebResourceRequest, error: WebResourceError) {
                          if (request.isForMainFrame) showOffline()
                      }
                  }

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onJsConfirm(view: WebView, url: String?, message: String?, result: JsResult): Boolean {
                          AlertDialog.Builder(this@MainActivity)
                              .setMessage(message)
                              .setPositiveButton(android.R.string.ok) { _, _ -> result.confirm() }
                              .setNegativeButton(android.R.string.cancel) { _, _ -> result.cancel() }
                              .setOnCancelListener { result.cancel() }
                              .show()
                          return true
                      }

                      override fun onJsAlert(view: WebView, url: String?, message: String?, result: JsResult): Boolean {
                          AlertDialog.Builder(this@MainActivity)
                              .setMessage(message)
                              .setPositiveButton(android.R.string.ok) { _, _ -> result.confirm() }
                              .setOnCancelListener { result.confirm() }
                              .show()
                          return true
                      }
                  }

                  refresh.setOnChildScrollUpCallback { _, _ -> web.scrollY > 0 }
                  refresh.setOnRefreshListener { reload() }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (web.canGoBack()) web.goBack() else finish()
                      }
                  })

                  if (savedInstanceState != null) web.restoreState(savedInstanceState) else web.loadUrl(BuildConfig.PORTAL_URL)
              }

              private fun reload() {
                  // إذا كانت صفحة "لا يوجد اتصال" ظاهرة، نعيد تحميل البوابة نفسها
                  val cur = web.url ?: ""
                  if (cur.isEmpty() || cur.startsWith("data:") || cur.startsWith("about:")) web.loadUrl(BuildConfig.PORTAL_URL) else web.reload()
              }

              private fun showOffline() {
                  refresh.isRefreshing = false
                  val html = assets.open("offline.html").bufferedReader().use { it.readText() }
                      .replace("%URL%", BuildConfig.PORTAL_URL)
                  web.loadDataWithBaseURL(BuildConfig.PORTAL_URL, html, "text/html", "utf-8", null)
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  web.saveState(outState)
              }

              override fun onPause() {
                  super.onPause()
                  CookieManager.getInstance().flush()
              }
          }
          DNEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'DNEOF'
          <resources>
              <string name="app_name">Data Net</string>
          </resources>
          DNEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'DNEOF'
          <resources>
              <style name="Theme.DataNet" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="colorPrimary">#337B8F</item>
                  <item name="colorPrimaryDark">#122028</item>
                  <item name="android:statusBarColor">#122028</item>
                  <item name="android:navigationBarColor">#122028</item>
              </style>
          </resources>
          DNEOF
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'DNEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/refresh"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/web"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          DNEOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/offline.html <<'DNEOF'
          <!doctype html>
          <html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#122028;color:#e8eef0;font-family:sans-serif;text-align:center;padding:24px}
          h1{font-size:20px;margin:0 0 8px}p{opacity:.75;font-size:14px;margin:0 0 24px}
          a{display:inline-block;background:#337B8F;color:#fff;text-decoration:none;padding:12px 32px;border-radius:12px;font-size:16px}
          </style></head><body><div>
          <h1>ما في اتصال بالبوابة</h1>
          <p>تأكد إنك متصل بخط الإنترنت تبعك وجرّب مرة ثانية.</p>
          <a href="%URL%">إعادة المحاولة</a>
          </div></body></html>
          DNEOF
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          echo '' | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build debug APK
        run: cd _app && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DataNet-APK
          path: _app/app/build/outputs/apk/debug/app-debug.apk
